<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ventitable · Ubicación</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f0e8;
  --surface:#ffffff;
  --fg:#2c2118;
  --muted:#6b5a4a;
  --line:#e0d5c5;
  --accent:#6b3e2e;
  --accent-soft:#efe6d8;
  --wood:#a8754a;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:'Figtree',system-ui,sans-serif;
  font-size:16px;
  line-height:1.55;
  padding:32px 20px 48px;
}
.wrap{max-width:720px;margin:0 auto}
.brand{
  font-family:'Bricolage Grotesque',system-ui,sans-serif;
  font-weight:700;
  font-size:clamp(1.8rem,5vw,2.4rem);
  letter-spacing:.04em;
  margin:0 0 8px;
  color:var(--fg);
}
.brand span{color:var(--accent)}
.meta{
  color:var(--muted);
  font-size:1rem;
  margin:0 0 28px;
  display:flex;
  flex-wrap:wrap;
  gap:6px 10px;
  align-items:center;
}
.meta .dot{
  width:4px;height:4px;
  border-radius:50%;
  background:var(--wood);
  flex-shrink:0;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(44,33,24,.06);
}
.map-wrap{
  position:relative;
  aspect-ratio:16/10;
  background:var(--accent-soft);
}
.map-wrap iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}
.info{
  padding:20px 22px 22px;
  display:grid;
  gap:14px;
}
.row{
  display:flex;
  gap:12px;
  align-items:flex-start;
}
.icon{
  width:36px;height:36px;
  border-radius:10px;
  background:var(--accent-soft);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.icon svg{width:18px;height:18px}
.row strong{
  font-family:'Bricolage Grotesque',system-ui,sans-serif;
  font-weight:600;
  font-size:.95rem;
  display:block;
  margin-bottom:2px;
}
.row span{color:var(--muted);font-size:.92rem}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:6px;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font:inherit;
  font-weight:600;
  font-size:.92rem;
  text-decoration:none;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
  border:0;
  transition:filter .15s;
}
.btn:hover{filter:brightness(1.08)}
.btn-primary{
  background:var(--accent);
  color:#fff;
}
.btn-ghost{
  background:var(--accent-soft);
  color:var(--accent);
}
footer{
  margin-top:28px;
  text-align:center;
  font-size:.85rem;
  color:var(--muted);
}
footer b{color:var(--fg);user-select:all}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="brand">VENTI<span>TABLE</span></h1>
  <p class="meta">
    <span>Sucre, Bolivia</span>
    <span class="dot"></span>
    <span>Zona Azari</span>
    <span class="dot"></span>
    <span>Lunes a Sábado · 9:00 – 18:00</span>
  </p>

  <div class="card">
    <div class="map-wrap">
      <!-- Mapa de Azari, Sucre. Puedes cambiar el src si tienes un enlace de Google Maps más preciso. -->
      <iframe
        title="Ubicación Ventitable en Azari, Sucre"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        src="https://maps.google.com/maps?q=Azari,+Sucre,+Bolivia&z=15&output=embed">
      </iframe>
    </div>
    <div class="info">
      <div class="row">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div>
          <strong>Dirección</strong>
          <span>Zona Azari, Sucre · Bolivia</span>
        </div>
      </div>
      <div class="row">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <div>
          <strong>Horario</strong>
          <span>LUNES A SABADO de 9:00 a 18:00</span>
        </div>
      </div>
      <div class="row">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <div>
          <strong>WhatsApp</strong>
          <span>68629333</span>
        </div>
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="https://wa.me/59168629333" target="_blank" rel="noopener">
          Escribir por WhatsApp
        </a>
        <a class="btn btn-ghost" href="https://maps.google.com/?q=Azari,+Sucre,+Bolivia" target="_blank" rel="noopener">
          Abrir en Google Maps
        </a>
      </div>
    </div>
  </div>

  <footer>
    Ventitable · Pedidos por WhatsApp <b>68629333</b>
  </footer>
</div>
</body>
</html>
