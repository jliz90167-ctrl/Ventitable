<title>Graduación</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#000;
    color:white;
}

/* Secciones */
section{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

/* TITULOS */
.colegio{
    color:gold;
    margin-bottom:20px;
    text-align:center;
}

.subtitulo{
    color:gold;
    margin-bottom:50px;
}

h1{
    font-size:60px;
    text-align:center;
    margin-bottom:60px;
}

/* CUENTA REGRESIVA */
.contador{
    display:flex;
    gap:20px;
    margin-bottom:30px;
}

.caja{
    width:130px;
    height:130px;
    border:4px solid gold;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    font-weight:bold;
}

.texto{
    color:gold;
    margin-top:20px;
    font-size:25px;
}

/* NUESTRA HISTORIA */
.historia h2{
    font-size:65px;
    margin-bottom:40px;
}

.galeria{
    width:80%;
    max-width:900px;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:15px;
}

.grande img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:20px;
}

.lado{
    display:grid;
    grid-template-rows:1fr 1fr;
    gap:15px;
}

.lado img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:20px;
}
</style>
</head>

<body>

<!-- PRIMERA PANTALLA -->
<section>

<div class="colegio">
Colegio Jose Clemente Maurer de Azari - Sucre, Bolivia
</div>

<div class="subtitulo">
CUENTA REGRESIVA
</div>

<h1>LA GRADUACIÓN SE ACERCA</h1>

<div class="contador">
    <div class="caja" id="dias">00</div>
    <div class="caja" id="horas">00</div>
    <div class="caja" id="minutos">00</div>
    <div class="caja" id="segundos">00</div>
</div>

<div class="texto">
MOMENTOS QUE QUEDAN
</div>

</section>

<!-- SEGUNDA PANTALLA -->
<section class="historia">

<h2>NUESTRA HISTORIA</h2>

<div class="galeria">

<div class="grande">
<img src="gojo.jpeg">
</div>

<div class="lado">
<img src="mono.jpg">
<img src="gojo.jpeg">
</div>

</div>

</section>

<script>

// Fecha de graduación
const fechaFinal = new Date("Dec 20, 2026 18:00:00").getTime();

setInterval(() => {

const ahora = new Date().getTime();
const distancia = fechaFinal - ahora;

const dias = Math.floor(distancia / (1000*60*60*24));
const horas = Math.floor((distancia % (1000*60*60*24)) / (1000*60*60));
const minutos = Math.floor((distancia % (1000*60*60)) / (1000*60));
const segundos = Math.floor((distancia % (1000*60)) / 1000);

document.getElementById("dias").innerHTML = dias;
document.getElementById("horas").innerHTML = horas;
document.getElementById("minutos").innerHTML = minutos;
document.getElementById("segundos").innerHTML = segundos;

},1000);

</script>

</body>
